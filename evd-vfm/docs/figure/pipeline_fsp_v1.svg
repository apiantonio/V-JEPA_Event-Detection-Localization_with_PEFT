<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 1160" width="1460" height="1160" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#fee2e2"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#dc2626" stroke-width="2.4"/>
    </pattern>
    <pattern id="hatchWin" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#dbeafe"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2563eb" stroke-width="1.8"/>
    </pattern>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <rect width="1460" height="1160" fill="#ffffff"/>

  <text x="40" y="46" font-size="25" font-weight="700" fill="#0f172a">Protocollo few-shot FSP-v1 &#8212; pipeline di training e di valutazione</text>
  <text x="40" y="70" font-size="14" fill="#64748b">V-JEPA 2.1-L &#183; finestre causali 16 frame @ 7,5 fps (span 2,0 s), hop 1,0 s &#183; k segmenti-evento per classe, m &#8804; 8 finestre per segmento &#183; 5 semi</text>

  <!-- ===================== TRAINING ===================== -->
  <rect x="30" y="90" width="1400" height="580" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="30" y="90" width="6" height="580" rx="3" fill="#2563eb"/>
  <text x="54" y="120" font-size="18" font-weight="700" fill="#1e3a8a">TRAINING &#8212; la testa impara da k esempi</text>
  <text x="392" y="120" font-size="13" fill="#64748b">sorgente: pool di training (Anomaly_Train) &#183; unico punto non deterministico del protocollo</text>

  <!-- riga 1: video -->
  <text x="54" y="158" font-size="13.5" font-weight="600" fill="#334155">1 &#183; Pool di training</text>
  <text x="54" y="176" font-size="11.5" fill="#64748b">1610 video, dedup</text>
  <text x="54" y="191" font-size="11.5" fill="#64748b">sha256 (Q19)</text>

  <rect x="250" y="146" width="230" height="34" rx="4" fill="#fff" stroke="#94a3b8"/>
  <rect x="330" y="146" width="66" height="34" fill="url(#hatch)" stroke="#dc2626"/>
  <text x="345" y="139" font-size="12" font-weight="600" fill="#b91c1c">A1</text>

  <rect x="510" y="146" width="230" height="34" rx="4" fill="#fff" stroke="#94a3b8"/>
  <rect x="556" y="146" width="52" height="34" fill="url(#hatch)" stroke="#dc2626"/>
  <rect x="648" y="146" width="44" height="34" fill="url(#hatch)" stroke="#dc2626"/>
  <text x="566" y="139" font-size="12" font-weight="600" fill="#b91c1c">A2</text>
  <text x="656" y="139" font-size="12" font-weight="600" fill="#b91c1c">A2</text>

  <rect x="770" y="146" width="180" height="34" rx="4" fill="#fff" stroke="#94a3b8"/>
  <text x="800" y="139" font-size="12" font-weight="600" fill="#475569">Normal</text>
  <text x="972" y="169" font-size="15" fill="#94a3b8">&#183; &#183; &#183;</text>

  <text x="1030" y="152" font-size="11.5" fill="#475569">segmento annotato = (classe, inizio, fine)</text>
  <text x="1030" y="169" font-size="11.5" fill="#475569">1831 sul dataset &#183; la classe si legge</text>
  <text x="1030" y="186" font-size="11.5" fill="#475569">dall&#8217;intervallo, mai dalla cartella</text>

  <!-- riga 2: support -->
  <path d="M300,184 L300,214" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M578,184 C578,200 470,200 452,214" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arw)"/>
  <path d="M668,184 C668,200 580,200 562,214" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arw)"/>
  <path d="M858,184 C858,202 700,204 678,214" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arw)"/>

  <text x="54" y="232" font-size="13.5" font-weight="600" fill="#334155">2 &#183; Support</text>
  <text x="54" y="250" font-size="11.5" fill="#64748b">k segmenti-evento per</text>
  <text x="54" y="265" font-size="11.5" fill="#64748b">classe (&#8804; &#8968;k/2&#8969; dallo</text>
  <text x="54" y="280" font-size="11.5" fill="#64748b">stesso video) +</text>
  <text x="54" y="295" font-size="11.5" fill="#64748b">altrettanti segmenti</text>
  <text x="54" y="310" font-size="11.5" fill="#64748b">normali di 2 s</text>

  <rect x="266" y="216" width="68" height="30" rx="3" fill="url(#hatch)" stroke="#dc2626"/>
  <rect x="418" y="216" width="68" height="30" rx="3" fill="url(#hatch)" stroke="#dc2626"/>
  <rect x="528" y="216" width="68" height="30" rx="3" fill="url(#hatch)" stroke="#dc2626"/>
  <rect x="644" y="216" width="68" height="30" rx="3" fill="#fff" stroke="#94a3b8"/>
  <text x="660" y="236" font-size="11" fill="#475569">Norm</text>
  <text x="734" y="236" font-size="15" fill="#94a3b8">&#183; &#183; &#183;</text>

  <text x="790" y="226" font-size="11.5" fill="#475569">query e support sono disgiunti per video.</text>
  <text x="790" y="243" font-size="11.5" fill="#475569">A k = <tspan font-weight="600">full</tspan>: 1554 segmenti-evento contro un pool di</text>
  <text x="790" y="260" font-size="11.5" fill="#475569">781 video normali &#8594; la quota <tspan font-weight="600">satura</tspan> (1554 : 781).</text>

  <!-- riga 3: finestre -->
  <path d="M300,250 L300,286" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="54" y="336" font-size="13.5" font-weight="600" fill="#334155">3 &#183; Finestre di training</text>
  <text x="54" y="354" font-size="11.5" fill="#64748b">16 frame @ 7,5 fps</text>
  <text x="54" y="369" font-size="11.5" fill="#64748b">= span 2,0 s, hop 1,0 s</text>
  <text x="54" y="384" font-size="11.5" fill="#64748b">etichetta = classe</text>
  <text x="54" y="399" font-size="11.5" fill="#64748b">dell&#8217;ultimo frame</text>

  <rect x="250" y="292" width="150" height="26" rx="3" fill="url(#hatchWin)" stroke="#2563eb"/>
  <path d="M250,324 L250,332 L400,332 L400,324" stroke="#475569" stroke-width="1.2" fill="none"/>
  <text x="311" y="346" font-size="11" fill="#475569">2 s</text>
  <text x="392" y="288" font-size="11" font-weight="600" fill="#1d4ed8">t</text>

  <rect x="325" y="356" width="150" height="26" rx="3" fill="url(#hatchWin)" stroke="#2563eb"/>
  <path d="M325,388 L325,396 L475,396 L475,388" stroke="#475569" stroke-width="1.2" fill="none"/>
  <text x="386" y="410" font-size="11" fill="#475569">2 s</text>
  <text x="462" y="352" font-size="11" font-weight="600" fill="#1d4ed8">t+1</text>

  <path d="M250,340 L250,348 L325,348 L325,340" stroke="#94a3b8" stroke-width="1.1" fill="none"/>
  <text x="266" y="362" font-size="10.5" fill="#94a3b8">hop 1 s</text>

  <text x="620" y="290" font-size="12" fill="#334155">se il segmento contiene pi&#249; di <tspan font-weight="700">m = 8</tspan> finestre &#8594; se ne prendono <tspan font-weight="700">8 equispaziate</tspan></text>
  <rect x="620" y="300" width="700" height="26" rx="3" fill="url(#hatch)" stroke="#dc2626"/>
  <g fill="url(#hatchWin)" stroke="#2563eb">
    <rect x="620" y="334" width="76" height="18" rx="2"/>
    <rect x="709" y="334" width="76" height="18" rx="2"/>
    <rect x="798" y="334" width="76" height="18" rx="2"/>
    <rect x="887" y="334" width="76" height="18" rx="2"/>
    <rect x="976" y="334" width="76" height="18" rx="2"/>
    <rect x="1065" y="334" width="76" height="18" rx="2"/>
    <rect x="1154" y="334" width="76" height="18" rx="2"/>
    <rect x="1243" y="334" width="76" height="18" rx="2"/>
  </g>
  <text x="620" y="376" font-size="11.5" fill="#475569">Un segmento <tspan font-weight="600">normale</tspan> di 2 s cade su ~2 endpoint della griglia &#8594; tipicamente <tspan font-weight="600">2 finestre</tspan></text>
  <text x="620" y="393" font-size="11.5" fill="#475569">(26 finestre normali a k=1, 103 a k=4, 827 a k=32 &#8212; &#232; il campione su cui poggia &#964;).</text>

  <!-- catena orizzontale training -->
  <path d="M330,412 L330,436" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="250" y="440" width="248" height="88" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="264" y="461" font-size="12.5" font-weight="700" fill="#1e3a8a">4 &#183; Preprocessing + augmentation</text>
  <text x="264" y="480" font-size="10.8" fill="#334155">RandAugment m7-n4 sui frame <tspan font-style="italic">interi</tspan> &#8594;</text>
  <text x="264" y="495" font-size="10.8" fill="#334155">normalizza &#8594; random resized crop</text>
  <text x="264" y="510" font-size="10.8" fill="#334155">area 0,08&#8211;1,0 <tspan font-weight="600">diretto a 256&#215;256</tspan> &#8594;</text>
  <text x="264" y="523" font-size="10.8" fill="#334155">niente flip &#8594; random erasing 0,25</text>

  <path d="M498,484 L528,484" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="530" y="440" width="230" height="88" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="544" y="461" font-size="12.5" font-weight="700" fill="#1e3a8a">5 &#183; Forward</text>
  <text x="544" y="480" font-size="10.8" fill="#334155">V-JEPA 2.1-L <tspan font-weight="600">congelato</tspan> (E2)</text>
  <text x="544" y="495" font-size="10.8" fill="#334155">oppure <tspan font-weight="600">adattato</tspan> PEFT (E3)</text>
  <text x="544" y="510" font-size="10.8" fill="#334155">layer gerarchici [5, 11, 17, 23]</text>
  <text x="544" y="523" font-size="10.8" fill="#334155">autocast BF16, pesi/input FP32</text>

  <path d="M760,484 L790,484" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="792" y="440" width="252" height="88" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="806" y="461" font-size="12.5" font-weight="700" fill="#1e3a8a">6 &#183; Adattamento della testa</text>
  <text x="806" y="480" font-size="10.8" fill="#334155">testa a <tspan font-weight="600">14 vie</tspan> (13 anomalie + Normal)</text>
  <text x="806" y="495" font-size="10.8" fill="#334155">selezione LR: split episodico 75/25 nel</text>
  <text x="806" y="510" font-size="10.8" fill="#334155">support (k &#8805; 4, senza augmentation),</text>
  <text x="806" y="523" font-size="10.8" fill="#334155">poi <tspan font-weight="600">re-fit sull&#8217;intero support</tspan></text>

  <path d="M1044,484 L1074,484" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="1076" y="440" width="244" height="88" rx="8" fill="#fef9c3" stroke="#facc15"/>
  <text x="1090" y="461" font-size="12.5" font-weight="700" fill="#854d0e">7 &#183; Soglia &#964;</text>
  <text x="1090" y="480" font-size="10.8" fill="#334155">&#964; = <tspan font-weight="600">95&#176; percentile</tspan> degli score</text>
  <text x="1090" y="495" font-size="10.8" fill="#334155">delle finestre <tspan font-weight="600">normali del support</tspan></text>
  <text x="1090" y="510" font-size="10.8" fill="#334155">stessa regola per ogni metodo e k</text>
  <text x="1090" y="523" font-size="10.8" fill="#b91c1c">mai stimata sulla query</text>

  <rect x="250" y="544" width="1070" height="52" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="266" y="565" font-size="11.5" fill="#475569"><tspan font-weight="700" fill="#0f172a">Budget:</tspan> due bracci riportati entrambi &#8212; epoche fisse (primario) e passi fissi (sensibilit&#224;) &#183; <tspan font-weight="700" fill="#0f172a">semi 1&#8211;5</tspan> identici a ogni k &#183; k &#8712; {1, 2, 4, 8, 16, 32, full}</text>
  <text x="266" y="585" font-size="11.5" fill="#475569"><tspan font-weight="700" fill="#b91c1c">Prezzo dichiarato dell&#8217;augmentation (E0g):</tspan> &#8722;0,070 di chunk AUC a k=1 (unanime su 5 semi), +0,020 a k=8. Il primo punto della curva va letto sapendolo.</text>

  <rect x="250" y="608" width="1070" height="46" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="266" y="629" font-size="11.5" fill="#475569"><tspan font-weight="700" fill="#0f172a">Feature store:</tspan> &#232; <tspan font-weight="600">query-side</tspan>. Il support non ci &#232; mai stato, quindi ogni finestra di training viene decodificata e forwardata. In E3 (PEFT) il</text>
  <text x="266" y="646" font-size="11.5" fill="#475569">backbone &#232; modificato, e lo store non &#232; leggibile <tspan font-style="italic">nemmeno in valutazione</tspan>: forward on-the-fly (invariante 3).</text>

  <!-- ===================== VALUTAZIONE ===================== -->
  <rect x="30" y="694" width="1400" height="430" rx="14" fill="#f6fdfa" stroke="#a7f3d0"/>
  <rect x="30" y="694" width="6" height="430" rx="3" fill="#059669"/>
  <text x="54" y="724" font-size="18" font-weight="700" fill="#065f46">VALUTAZIONE &#8212; come si producono i numeri</text>
  <text x="486" y="724" font-size="13" fill="#64748b">interamente deterministica &#183; gli stessi 290 video in ogni esperimento, mai toccati durante l&#8217;adattamento</text>

  <text x="54" y="762" font-size="13.5" font-weight="600" fill="#334155">1 &#183; Query</text>
  <text x="54" y="780" font-size="11.5" fill="#64748b">290 video dello split</text>
  <text x="54" y="795" font-size="11.5" fill="#64748b">di test ufficiale</text>

  <rect x="250" y="748" width="1070" height="30" rx="4" fill="#fff" stroke="#94a3b8"/>
  <rect x="560" y="748" width="140" height="30" fill="url(#hatch)" stroke="#dc2626"/>
  <text x="576" y="742" font-size="11" font-weight="600" fill="#b91c1c">evento annotato</text>

  <text x="54" y="826" font-size="13.5" font-weight="600" fill="#334155">2 &#183; Griglia causale</text>
  <text x="54" y="844" font-size="11.5" fill="#64748b">finestre di 16 frame</text>
  <text x="54" y="859" font-size="11.5" fill="#64748b">(2,0 s) ogni 1,0 s, che</text>
  <text x="54" y="874" font-size="11.5" fill="#64748b">terminano in t &#8212; mai</text>
  <text x="54" y="889" font-size="11.5" fill="#64748b">un frame di futuro</text>

  <g fill="url(#hatchWin)" stroke="#2563eb">
    <rect x="250" y="790" width="150" height="16" rx="2"/>
    <rect x="325" y="810" width="150" height="16" rx="2"/>
    <rect x="400" y="830" width="150" height="16" rx="2"/>
    <rect x="475" y="850" width="150" height="16" rx="2"/>
  </g>
  <text x="646" y="806" font-size="11.5" fill="#475569">hop 1,0 s &#183; l&#8217;ultima finestra &#232; ancorata all&#8217;<tspan font-weight="600">ultimo frame</tspan> del video.</text>
  <text x="646" y="824" font-size="11.5" fill="#475569">Verit&#224; di un chunk = classe annotata al suo <tspan font-weight="600">ultimo frame</tspan> (Normal se t &#232; fuori da ogni intervallo).</text>
  <text x="646" y="842" font-size="11.5" fill="#475569">Gli istanti prima della prima finestra completa restano <tspan font-weight="600">senza score</tspan> (warm-up dichiarato).</text>
  <text x="646" y="862" font-size="14" fill="#94a3b8">&#183; &#183; &#183;</text>

  <path d="M330,872 L330,896" stroke="#047857" stroke-width="1.6" marker-end="url(#arwG)"/>

  <rect x="250" y="900" width="236" height="90" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="264" y="921" font-size="12.5" font-weight="700" fill="#065f46">3 &#183; Preprocessing deterministico</text>
  <text x="264" y="941" font-size="10.8" fill="#334155">lato corto &#8594; 256 px (aspect invariato)</text>
  <text x="264" y="956" font-size="10.8" fill="#334155">&#8594; <tspan font-weight="600">crop centrale quadrato</tspan> 256&#215;256</text>
  <text x="264" y="971" font-size="10.8" fill="#334155">(4:3 &#8594; 1:1, scarta ~25% di larghezza)</text>
  <text x="264" y="985" font-size="10.8" fill="#b91c1c">nessuna trasformazione casuale</text>

  <path d="M486,944 L516,944" stroke="#047857" stroke-width="1.6" marker-end="url(#arwG)"/>

  <rect x="518" y="900" width="230" height="90" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="532" y="921" font-size="12.5" font-weight="700" fill="#065f46">4 &#183; Forward</text>
  <text x="532" y="941" font-size="10.8" fill="#334155">stesso encoder e stessi layer</text>
  <text x="532" y="956" font-size="10.8" fill="#334155">del training</text>
  <text x="532" y="971" font-size="10.8" fill="#334155">E2: feature dallo <tspan font-weight="600">store fp16</tspan></text>
  <text x="532" y="985" font-size="10.8" fill="#334155">(100% della griglia) &#183; E3: on-the-fly</text>

  <path d="M748,944 L778,944" stroke="#047857" stroke-width="1.6" marker-end="url(#arwG)"/>

  <rect x="780" y="900" width="212" height="90" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="794" y="921" font-size="12.5" font-weight="700" fill="#065f46">5 &#183; Testa &#8594; 14 probabilit&#224;</text>
  <text x="794" y="945" font-size="10.8" fill="#334155"><tspan font-weight="700">a)</tspan> p(classe), one-vs-rest</text>
  <text x="794" y="967" font-size="10.8" fill="#334155"><tspan font-weight="700">b)</tspan> anomalia = 1 &#8722; p(Normal)</text>
  <text x="794" y="984" font-size="10.8" fill="#334155">&#160;&#160;&#160;&#160;allarme se sopra &#964;</text>

  <path d="M992,932 L1022,912" stroke="#047857" stroke-width="1.6" marker-end="url(#arwG)"/>
  <path d="M992,958 L1022,978" stroke="#047857" stroke-width="1.6" marker-end="url(#arwG)"/>

  <rect x="1024" y="880" width="296" height="52" rx="8" fill="#fff" stroke="#6ee7b7"/>
  <text x="1038" y="900" font-size="11.5" font-weight="700" fill="#065f46">a) AP per classe</text>
  <text x="1038" y="918" font-size="10.8" fill="#334155">one-vs-rest, le altre anomalie fra i negativi</text>

  <rect x="1024" y="944" width="296" height="78" rx="8" fill="#fff" stroke="#6ee7b7"/>
  <text x="1038" y="964" font-size="11.5" font-weight="700" fill="#065f46">b) score di anomalia sui chunk</text>
  <text x="1038" y="981" font-size="10.8" fill="#334155"><tspan font-weight="600">AUC / AP pooled</tspan> (primarie) + macro per-video</text>
  <text x="1038" y="997" font-size="10.8" fill="#334155">P/R/F1 a &#964; e sensibilit&#224; ai quantili 0,80&#8211;0,99</text>
  <text x="1038" y="1013" font-size="10.8" fill="#334155">latenza: primo chunk sopra &#964; (mediana, p90)</text>

  <rect x="250" y="1006" width="742" height="54" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="266" y="1028" font-size="11.5" fill="#475569"><tspan font-weight="700" fill="#0f172a">6 &#183; Aggregazioni.</tspan> <tspan font-weight="600">Frame:</tspan> proiezione causale &#8212; il frame t tiene lo score del chunk</text>
  <text x="266" y="1046" font-size="11.5" fill="#475569">pi&#249; recente terminato non dopo t. <tspan font-weight="600">Video:</tspan> max sui suoi chunk.</text>

  <text x="40" y="1148" font-size="11" fill="#94a3b8">Proiezione di configs/protocol/fsp_v1.yaml (ADR-024&#8230;028), congelato il 25 agosto 2026 &#8212; ratifica dei supervisori pendente. In caso di divergenza fa fede docs/04_spec_protocollo_fewshot.md.</text>
</svg>
