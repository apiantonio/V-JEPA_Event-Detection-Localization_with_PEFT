id: photometric
crop: false                       # niente ritaglio: il frame intero va a size x size
random_resize_scale: [1.0, 1.0]   # inerti con crop=false, e devono restare (1,1)
random_resize_ratio: [1.0, 1.0]
rand_augment: rand-m7-n4-mstd0.5-inc1
rand_augment_exclude: [Rotate, ShearX, ShearY, TranslateXRel, TranslateYRel]
horizontal_flip: false            # il probe ufficiale lo tiene spento (eval.py:439)
reprob: 0.0                       # niente random erasing
