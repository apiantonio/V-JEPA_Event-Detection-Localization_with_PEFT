   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #132639" x="36.54" y="49.05225" transform="rotate(-0 36.54 49.05225)">EVD / Video anomaly detection &amp; spatial localization</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #566a7f" x="36.54" y="72.849169" transform="rotate(-0 36.54 72.849169)">V-JEPA 2.1  •  Parameter-efficient adaptation  •  Integrated Gradients + VTCD</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1766a3" x="49.374" y="135.147412" transform="rotate(-0 49.374 135.147412)">01  VIDEO INPUT</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(49.374 162.805481)">Surveillance video</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(49.374 178.466387)">Native frames + timestamps</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(49.374 194.127294)">Causal processing</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1766a3" x="247.464" y="135.147412" transform="rotate(-0 247.464 135.147412)">02  PREPROCESSING</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(247.464 162.805481)">8 s windows / 4 s hop</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(247.464 178.466387)">32 frames / resize to 384 × 384</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(247.464 194.127294)">No crop / normalize / 9,216 tokens</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1766a3" x="495.774" y="135.147412" transform="rotate(-0 495.774 135.147412)">03  ANOMALY DETECTOR</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(495.774 162.805481)">V-JEPA 2.1 ViT-L encoder</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(495.774 178.466387)">Frozen probe, LoRA / DoRA or VPT</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(495.774 194.127294)">Attentive head → anomaly score</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1766a3" x="766.404" y="135.147412" transform="rotate(-0 766.404 135.147412)">04  TEMPORAL OUTPUT</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(766.404 162.805481)">Validation threshold → alarms</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(766.404 178.466387)">Score timeline + event intervals</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(766.404 194.127294)">Shared evaluation / replay engine</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087e86" x="49.374" y="326.415413" transform="rotate(-0 49.374 326.415413)">05  CONCEPT DICTIONARIES</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(49.374 354.073481)">Training reference tokens</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(49.374 369.734388)">VTCD: discover recurring concepts</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(49.374 385.395294)">Global or class-specific dictionaries</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087e86" x="306.054" y="326.415413" transform="rotate(-0 306.054 326.415413)">06  IG + VTCD LOCALIZATION</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(306.054 354.073481)">Class head routes the chunk</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(306.054 369.734388)">IG attributes the anomaly logit</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(306.054 385.395294)">Rank concepts by signed IG mass</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(306.054 401.0562)">Select concepts → spatial masks</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087e86" x="585.054" y="326.415413" transform="rotate(-0 585.054 326.415413)">07  BOX PROPOSALS</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(585.054 354.073481)">Connected components</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(585.054 369.734388)">Native-pixel coordinates</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(585.054 385.395294)">Per-frame rectangles</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(585.054 401.0562)">No box-supervised training</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087e86" x="788.724" y="326.415413" transform="rotate(-0 788.724 326.415413)">08  EVD STUDIO</text>
   </g>
   <g id="text_18">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(788.724 354.073481)">Video + localization boxes</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(788.724 369.734388)">Scores, threshold and alarms</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(788.724 385.395294)">Timeline / saved replay</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #566a7f" transform="translate(788.724 401.0562)">Exported video + JSON</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087e86" x="421.56" y="268.490437" transform="rotate(-0 421.56 268.490437)">tokens + gradients</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1766a3" x="36.54" y="484.706438" transform="rotate(-0 36.54 484.706438)">LEARNING</text>
   </g>
   <g id="text_21">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #566a7f" x="125.82" y="485.466281" transform="rotate(-0 125.82 485.466281)">Temporal labels train the detector; class labels train routing heads. Thresholds use validation data.</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087e86" x="36.54" y="516.307238" transform="rotate(-0 36.54 516.307238)">EVALUATION</text>
   </g>
   <g id="text_23">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #566a7f" x="125.82" y="516.687159" transform="rotate(-0 125.82 516.687159)">Spatial test annotations are used only for evaluation. The README clip shows saved offline boxes inside annotated intervals.</text>
   </g>
  </g>
 </g>
