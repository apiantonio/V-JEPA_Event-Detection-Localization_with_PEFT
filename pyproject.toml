# Package metadata of the thesis code. The package lives in `evd-vfm/src/evd` and is
# installed from the repository root with `pip install -e .`.
#
# Lower bounds only: the code was run on Python 3.10 with torch 2.5.1+cu118 (Windows) and
# on Python 3.12 with torch 2.6.0+cu124 (Linux cluster). Every run records the exact
# environment that produced its numbers in its `meta.json`.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evd-vfm"
version = "0.1.0"
description = "Automatic event detection in surveillance videos with video foundation models (UNISA master's thesis)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Antonio Apicella" }]

dependencies = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",  # install it with torch, from the same index
    "numpy>=2.2",
    "av>=17.1",             # default video decoder (PyAV)
    "scikit-learn>=1.7",
    "scipy>=1.13",          # connected components of the boxes, NNLS of the VTCD concepts
    "matplotlib>=3.10",
    "hydra-core>=1.3.4",    # config composition; brings omegaconf and PyYAML
    "safetensors>=0.8",     # feature store
]

[project.optional-dependencies]
demo = ["opencv-python-headless>=4.10"]
dev = [
    "ruff>=0.16",
    "mypy>=1.11",
]
# torchcodec is an alternative decoder, selected through the config (`data.decoder`).
codec = ["torchcodec>=0.4"]

[tool.setuptools.packages.find]
where = ["evd-vfm/src"]

[tool.setuptools.package-data]
evd = ["py.typed"]

# --- lint -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["evd-vfm/src", "evd-vfm/scripts"]
# Excluded: Markdown, the verbatim copies of the Meta source, the laboratory's OVAD code
# (run unmodified), the reference implementation and the data.
extend-exclude = [
    "*.md",
    "evd-vfm/src/evd/vendor/**",
    "evd-vfm/ovad_protocol/**",
    "vjepa2/**",
    "data/**",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = [
    "E501",  # line length is enforced by the formatter
    "B008",  # calls in defaults: used in dataclass factories
]

[tool.ruff.format]
quote-style = "double"

# --- types ------------------------------------------------------------------
# Strict only where a bug costs a wrong number: protocol and evaluation.
[tool.mypy]
python_version = "3.10"
files = ["evd-vfm/src/evd"]
mypy_path = "evd-vfm/src"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["evd.protocol.*", "evd.eval.*"]
strict = true
